name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: zaidbharde
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#f3b84d&color_dots=#fff7eb,#f6d8a7,#e6aa55,#b85b2e,#7e1414
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f3b84d&color_dots=#2d3343,#5b382a,#8f4b1c,#c87c2e,#f3b84d

      - name: Push snake assets to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
